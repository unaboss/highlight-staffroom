<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b0e">
  <title>Staffroom Fast Track</title>
  <link rel="icon" href="/static/ft/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/ft/ft.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="school-bg" id="schoolBg" aria-hidden="true"></div>
  <header class="bar">
    <a class="mark" href="/fast-track-classic/login" aria-label="Staffroom Fast Track: sign in as another role">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6197f"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient></defs><path d="M16 3 28 10v12L16 29 4 22V10z" fill="url(#mg)"/><path d="M16 9 22 12.5v7L16 23l-6-3.5v-7z" fill="#0c0b0e" opacity=".55"/><path d="M17 11.5 13 17h3l-1 4.5 4-5.5h-3z" fill="#fff"/></svg>
      <span><b>Staffroom</b><i>Fast Track</i></span>
    </a>
    <nav class="switch" aria-label="View">
      <a href="#/class" data-view="class">Facilitator</a>
      <a href="#/play" data-view="play">Student</a>

      <span class="thumb" aria-hidden="true"></span>
    </nav>
    <div class="status" id="status"></div>
  </header>
  <main id="view" class="view"></main>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <div id="sheet" class="sheet" hidden></div>
  <script src="/static/ft/school.js"></script>
  <script src="/static/ft/ft.js"></script>
</body>
</html>
