<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Staffroom Fast Track</title>
<style>
:root{--bg:#0c0b0e;--s2:#1e171d;--line:rgba(255,170,210,.16);--v100:#fff0f7;--v200:#ffd1e6;--v300:#ff9ccb;--v400:#ff3d9a;--v500:#e6197f;--v600:#c00d68;--v700:#8f0a52;--v900:#5c0838;--muted:rgba(255,61,154,.8)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--v100);font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
.sky{position:fixed;left:0;right:0;top:0;height:var(--hz,62vh);background:radial-gradient(70vw 40vh at var(--vpx,50%) 100%,rgba(192,13,104,.30),transparent 70%),linear-gradient(180deg,#0c0b0e 0%,#140b12 60%,#22101b 100%);overflow:hidden}
.sky:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,170,210,.03) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,170,210,.03) 1px,transparent 1px) 0 0/40px 40px;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
/* sun */
.sun{position:absolute;left:var(--vpx,50%);bottom:0;width:var(--sun,520px);height:var(--sun,520px);transform:translate(-50%,50%) translateY(var(--rise,0));border-radius:50%;transition:transform 2.6s cubic-bezier(.2,.7,.2,1)}
body.loading .sun{--rise:var(--sun,520px)}
.sun .core{position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,#ffd1e6 0%,#ff3d9a 28%,#c00d68 55%,#5c0838 80%);
 -webkit-mask:linear-gradient(180deg,#000 0 22%,transparent 22% 23%,#000 23% 28%,transparent 28% 29.6%,#000 29.6% 34%,transparent 34% 36.2%,#000 36.2% 39.6%,transparent 39.6% 42.4%,#000 42.4% 45%,transparent 45% 48.4%,#000 48.4% 100%);
 mask:linear-gradient(180deg,#000 0 22%,transparent 22% 23%,#000 23% 28%,transparent 28% 29.6%,#000 29.6% 34%,transparent 34% 36.2%,#000 36.2% 39.6%,transparent 39.6% 42.4%,#000 42.4% 45%,transparent 45% 48.4%,#000 48.4% 100%);
 filter:drop-shadow(0 0 40px rgba(230,25,127,.55))}
.sun .halo{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(230,25,127,.22) 52%,rgba(230,25,127,.10) 62%,rgba(230,25,127,.05) 70%,transparent 72%)}
/* school on horizon */
.school-wrap{position:absolute;left:var(--vpx,50%);width:var(--sw,640px);bottom:0;transform:translateX(-50%) translateY(var(--sdy,10%))}
.school-wrap svg{display:block;width:100%;filter:drop-shadow(0 0 6px rgba(255,61,154,.55))}
.d,.s{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.8s cubic-bezier(.6,.1,.2,1) forwards}
.flag{opacity:0;animation:fade .6s 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
/* ground */
canvas{position:fixed;left:0;right:0;bottom:0;top:var(--hz,62vh);width:100%;height:calc(100vh - var(--hz,62vh))}
.hz{position:fixed;left:0;right:0;top:var(--hz,62vh);height:2px;background:linear-gradient(90deg,transparent,var(--v400) 20%,var(--v200) var(--vpx,50%),var(--v400) 80%,transparent);box-shadow:0 0 18px rgba(255,61,154,.8);opacity:.9}
/* side bars */
.bar{position:fixed;top:24px;bottom:24px;width:10px;display:flex;flex-direction:column-reverse;gap:6px;z-index:3}
.bar.l{left:22px}.bar.r{right:22px}
.bar i{flex:1;border-radius:3px;background:rgba(255,170,210,.07);border:1px solid rgba(255,170,210,.10);transition:background .25s,box-shadow .25s}
.bar i.on{background:var(--v400);border-color:var(--v300);box-shadow:0 0 12px rgba(255,61,154,.8)}
.bar.done i{background:rgba(192,13,104,.45);box-shadow:none;border-color:rgba(255,170,210,.18);transition:background .8s,box-shadow .8s}
.status{position:fixed;left:50%;top:10vh;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;transition:opacity .5s;z-index:2}
.status b{width:7px;height:7px;border-radius:50%;background:var(--v400);box-shadow:0 0 10px var(--v400);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}body.ready .status{opacity:0}
/* card */
.card{position:fixed;left:50%;top:6vh;transform:translate(-50%,16px);width:min(420px,calc(100vw - 56px));padding:28px;border-radius:20px;background:linear-gradient(180deg,rgba(30,23,29,.78),rgba(16,13,16,.86));border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.85),0 0 60px -10px rgba(230,25,127,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .7s .15s,transform .7s .15s cubic-bezier(.2,.8,.2,1);z-index:2}
body.ready .card{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--v500),var(--v900));box-shadow:0 0 24px rgba(230,25,127,.55)}
.brand small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.brand strong{font-size:18px}
h1{font-size:26px;letter-spacing:-.025em;margin:0 0 6px}.sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:14px;background:rgba(12,11,14,.6);border:1px solid var(--line);margin-bottom:16px}
.roles button{all:unset;cursor:pointer;text-align:center;padding:10px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.roles button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.roles button[aria-pressed=true]{background:var(--s2);color:var(--v100);box-shadow:0 0 0 1px rgba(255,170,210,.22) inset,0 0 18px -4px rgba(230,25,127,.6)}
.roles button:focus-visible,.cta:focus-visible,.alt:focus-visible{outline:2px solid var(--v300);outline-offset:2px}
.cta{all:unset;box-sizing:border-box;cursor:pointer;margin-top:0;width:100%;text-align:center;padding:14px;border-radius:12px;font-weight:650;font-size:15px;color:#fff;background:linear-gradient(180deg,var(--v500),var(--v600));box-shadow:0 10px 30px -8px rgba(230,25,127,.7),0 1px 0 rgba(255,255,255,.18) inset;position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.2s 1s infinite}
@keyframes sheen{40%,100%{transform:translateX(120%)}}
.or{display:flex;align-items:center;gap:10px;margin:16px 0;color:rgba(255,170,210,.45);font-size:12px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.alt{all:unset;box-sizing:border-box;cursor:pointer;width:100%;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--v200);background:rgba(30,23,29,.55)}
.foot{margin-top:18px;font-size:12px;color:rgba(255,170,210,.5);text-align:center}
@media (min-width:900px){.card{left:max(7vw,64px);top:50%;transform:translate(-16px,-50%)}body.ready .card{transform:translate(0,-50%)}}
@media (max-width:520px){.bar{width:6px;gap:4px;top:16px;bottom:16px}.bar.l{left:12px}.bar.r{right:12px}.card{padding:22px}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){.d,.s{animation:none;stroke-dashoffset:0}.flag{animation:none;opacity:1}.sun{transition:none}.cta:after{animation:none}}

<script>
const root=document.documentElement,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,HZ,VPX,dpr;const cv=document.getElementById('g'),cx=cv.getContext('2d');
function layout(){W=innerWidth;H=innerHeight;const desk=W>=900;
 HZ=Math.round(H*(desk?0.6:0.68));VPX=desk?Math.round(W*0.64):Math.round(W/2);
 const sw=desk?Math.min(W*0.42,760):Math.min(W*0.96,520);
 root.style.setProperty('--hz',HZ+'px');root.style.setProperty('--vpx',VPX+'px');root.style.setProperty('--sw',sw+'px');
 root.style.setProperty('--sun',Math.round(sw*1.12)+'px');

addEventListener('resize',layout);layout();
// perspective ground
const K=()=>W*0.9;let phase=0,intro=reduce?1:0;const streaks=[];
function spawn(){const lane=(Math.random()*2-1)*0.6;streaks.push({x:lane,z:6+Math.random()*10,v:(0.035+Math.random()*0.05)*(Math.random()<.3?-1:1),len:0.6+Math.random()*1.2})}
for(let i=0;i<7;i++)spawn();
function P(x,z){const gh=H-HZ;return[VPX+x*K()/z, gh/z]}
function draw(t){const gh=H-HZ;cx.clearRect(0,0,W,gh);
 intro=Math.min(1,intro+0.012);
 // road fill
 const road=0.75,a=P(-road,0.6),b=P(road,0.6);
 let gr=cx.createLinearGradient(0,0,0,gh);gr.addColorStop(0,'rgba(192,13,104,.30)');gr.addColorStop(1,'rgba(92,8,56,.18)');
 cx.fillStyle=gr;cx.beginPath();cx.moveTo(VPX,0);cx.lineTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.closePath();cx.globalAlpha=intro;cx.fill();
 // radial lines
 for(let i=-14;i<=14;i++){const x=i*0.25,p=P(x,0.6);const edge=Math.abs(Math.abs(x)-road)<0.01;
  const g=cx.createLinearGradient(VPX,0,p[0],p[1]);g.addColorStop(0,'rgba(255,61,154,0)');g.addColorStop(.25,edge?'rgba(255,170,210,.9)':'rgba(230,25,127,.35)');g.addColorStop(1,edge?'rgba(255,209,230,1)':'rgba(230,25,127,.55)');
  cx.strokeStyle=g;cx.lineWidth=edge?2.2:1;cx.shadowColor=edge?'rgba(255,61,154,.9)':'transparent';cx.shadowBlur=edge?12:0;
  const e=P(x,0.6+(1-intro)*40);cx.beginPath();cx.moveTo(VPX,0);cx.lineTo(e[0],e[1]);cx.stroke()}
 cx.shadowBlur=0;
 // horizontal lines moving toward viewer
 if(!reduce)phase=(phase+0.012)%1;
 for(let n=0;n<40;n++){const z=0.6+(n+1-phase)*0.42*Math.pow(1.11,n);if(z>60)break;const y=gh/z;
  const al=Math.min(1,0.9/z)*intro;cx.strokeStyle=`rgba(230,25,127,${0.55*al})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
