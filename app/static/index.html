<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staffroom</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/icon.svg" alt="" width="30" height="30">
        <div><strong>Staffroom</strong><span>AI staff for online schools</span></div>
      </div>
      <select id="courseSelect" class="course-select" aria-label="Course"></select>
      <nav id="nav">
        <a href="#home" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
        <a href="#staffroom" data-page="staffroom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5M12 20c0-3 3-5 6-5 1.5 0 3 .5 4 1.3"/></svg>Staffroom <b id="liveDot" class="live-dot"></b></a>
        <a href="#plan" data-page="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h7"/></svg>Course plan</a>
        <a href="#class" data-page="class"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="15" height="12" rx="2"/><path d="M17 9l5-3v10l-5-3"/></svg>Class report</a>
        <a href="#tests" data-page="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 2h3v16H5V5h3z"/><path d="M9 12l2 2 4-4M9 17h6"/></svg>Tests <b id="testBadge" class="badge"></b></a>
        <a href="#learners" data-page="learners"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>Learners</a>
        <a href="#settings" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</a>
      </nav>
      <div class="side-foot">
        <div id="modelChip" class="chip"></div>
        <div id="integrations" class="integrations"></div>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <h1 id="courseTitle">Staffroom</h1>
          <p id="courseMeta" class="muted"></p>
        </div>
        <div class="actions" id="topActions"></div>
      </header>
      <section id="page"></section>
    </main>
  </div>
  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <button class="close" id="drawerClose" aria-label="Close">×</button>
      <div id="drawerBody"></div>
    </div>
  </div>
  <div id="popover" class="popover" hidden></div>
  <div id="toasts" class="toasts"></div>
  <script src="/static/app.js"></script>
</body>
</html>
