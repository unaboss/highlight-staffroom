# Render blueprint: a free web service built from the Dockerfile on the fast-track branch.
# Public demo mode: the made-up demo course only, read-only settings, live AI behind caps.
# Set NEBIUS_API_KEY (the DeepSeek key) as a secret in the Render dashboard; it is never shown in the app.
services:
  - type: web
    name: classroom-fast-track
    runtime: docker
    plan: free
    branch: fast-track
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FASTTRACK_DATA
        value: demo
      - key: FASTTRACK_PUBLIC
        value: "1"
      - key: FASTTRACK_PUBLIC_AI
        value: "1"
      # Live AI: add these three as secrets in the Render dashboard (never in the repo):
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.deepseek.com
      - key: NEBIUS_MODEL
        value: deepseek-chat
      - key: STAFFROOM_DB
        value: /tmp/staffroom.db
