<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" class="school" role="img" aria-label="Outline drawing of a school. Each staff room is an agent.">
<style>
.school{--ink:#ff9ccb;--bg:#0c0b0e;--staff:#e6197f;--staff2:#ff3d9a;--class:#ffd1e6}
.school .d,.school .s{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.school .s{fill:var(--bg)}
.school .glass{fill:transparent;transition:fill .5s,filter .5s}
.school .win.on .glass{fill:var(--staff);filter:drop-shadow(0 0 10px var(--staff))}
.school .win.on.alt .glass{fill:var(--staff2);filter:drop-shadow(0 0 10px var(--staff2))}
.school .win[data-room=class].on .glass{fill:var(--class);filter:drop-shadow(0 0 8px var(--class))}
.school .sign{fill:var(--ink);font:600 13px Inter,system-ui,sans-serif;letter-spacing:5px;text-anchor:middle}
.school .flag{fill:var(--staff);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
</style>
